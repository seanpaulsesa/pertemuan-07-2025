<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Followers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="bg-light">
        <div class="container py-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    
                    <h3 class="card-title mb-4 text-center">
                        GitHub Followers
                    </h3>

                    <div class="input-group mb-3">
                        <input type="text" id="username" class="form-control" placeholder="Enter GitHub Username">
                        <button class="btn btn-primary" onclick="getFollowers()">Get Followers</button>
                    </div>


                    <ul class="list-group" id="followersList"></ul>



                </div>
            </div>
        </div>
    </div>
    <script src="github.js"></script>
</body>
</html>
